name: libraries

services:
  postgres:
    profiles: ["local"]
    image: postgres:16-alpine
    container_name: libraries-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-librarydb}
      POSTGRES_USER: ${POSTGRES_USER:-library}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-library}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ${API_CONTEXT:-../LibrariesApiTest}
      dockerfile: Dockerfile
    image: ${API_IMAGE:-libraries-api:local}
    container_name: libraries-api
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env.local}
    environment:
      APP_ENV: ${APP_ENV:-local}
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      CONNECTION_STRING: ${CONNECTION_STRING}
      ConnectionStrings__DefaultConnection: ${CONNECTION_STRING}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
        required: false

  frontend:
    build:
      context: ${FE_CONTEXT:-../LibrariesFE}
      dockerfile: Dockerfile
    image: ${FE_IMAGE:-libraries-fe:local}
    container_name: libraries-fe
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env.local}
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
      API_TARGET: ${API_TARGET:-http://api:8080}
    ports:
      - "${FE_PORT:-5173}:5173"
    depends_on:
      - api

volumes:
  postgres_data:
